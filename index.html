<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="/LogoOpenSinFondo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Arena | Generador de Presupuestos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    
    <script>
      // Extrae automáticamente el "muñeco" (monigote deportivo) de LogoOpenSinFondo.jpg con zoom
      // idéntico al favicon de la web oficial de Open Arena:
      (function() {
        var img = new Image();
        img.src = '/LogoOpenSinFondo.jpg';
        img.onload = function() {
          try {
            var w = img.naturalWidth;
            var h = img.naturalHeight;

            var scanCanvas = document.createElement('canvas');
            scanCanvas.width = w;
            scanCanvas.height = h;
            var scanCtx = scanCanvas.getContext('2d');
            scanCtx.drawImage(img, 0, 0);

            var imgData = scanCtx.getImageData(0, 0, w, h);
            var data = imgData.data;

            // 1. Limpiar el fondo de damero (cuadrícula gris/blanca)
            for (var i = 0; i < data.length; i += 4) {
              var r = data[i];
              var g = data[i + 1];
              var b = data[i + 2];
              var maxDiff = Math.max(Math.abs(r - g), Math.abs(r - b), Math.abs(g - b));
              var brightness = (r + g + b) / 3;
              // Si es tono neutro claro (fondo damero), volver transparente
              if (brightness > 155 && maxDiff < 25) {
                data[i + 3] = 0;
              }
            }

            // 2. Encontrar los límites exactos del monigote (mitad superior de la imagen)
            var minX = w, maxX = 0, minY = h, maxY = 0;
            var maxYScan = Math.floor(h * 0.52); // El monigote está arriba del texto

            for (var y = 0; y < maxYScan; y++) {
              for (var x = 0; x < w; x++) {
                var idx = (y * w + x) * 4;
                if (data[idx + 3] > 30) { // Píxel visible
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }

            scanCtx.putImageData(imgData, 0, 0);

            // 3. Crear el favicon de 64x64 con zoom en el monigote
            if (maxX > minX && maxY > minY) {
              var figW = maxX - minX;
              var figH = maxY - minY;

              var favCanvas = document.createElement('canvas');
              var size = 64;
              favCanvas.width = size;
              favCanvas.height = size;
              var favCtx = favCanvas.getContext('2d');

              // Margen armónico para que se vea amplio y nítido como en openarena.es
              var padding = 5;
              var availSize = size - padding * 2;
              var scale = availSize / Math.max(figW, figH);

              var drawW = figW * scale;
              var drawH = figH * scale;
              var drawX = (size - drawW) / 2;
              var drawY = (size - drawH) / 2;

              favCtx.drawImage(
                scanCanvas,
                minX, minY, figW, figH,
                drawX, drawY, drawW, drawH
              );

              var link = document.getElementById('app-favicon') || document.querySelector("link[rel*='icon']");
              if (link) {
                link.type = 'image/png';
                link.href = favCanvas.toDataURL('image/png');
              }
            }
          } catch(e) {
            console.error(e);
          }
        };
      })();
    </script>
  </head>
  <body class="bg-[#f3ede1]/30 text-slate-800 antialiased selection:bg-[#2f7a52]/20 selection:text-[#1c2d52]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
